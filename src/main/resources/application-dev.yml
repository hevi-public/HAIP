spring:
  datasource:
    url: jdbc:sqlite:data/aiforum-dev.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5

aiforum:
  backups:
    enabled: true
  llm:
    # Dev dogfooding: let personas actually hit the web (e.g. "check HackerNews"). Leave the domain
    # allowlist blank for any host, or scope it (see application.yml) if you want to keep dev fetches tight.
    web-fetch-enabled: true
