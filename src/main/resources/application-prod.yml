spring:
  datasource:
    url: jdbc:sqlite:data/aiforum.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5

aiforum:
  backups:
    enabled: true
  llm:
    # Personas reach the network in prod too. Leave the allowlist blank for any host, or scope it via
    # web-fetch-allowed-domains (see application.yml) to keep production fetches tight.
    web-fetch-enabled: true
