spring:
  datasource:
    url: jdbc:sqlite:data/aiforum.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5

aiforum:
  backups:
    enabled: true
  llm:
    # Off in prod by default — turn on (and ideally scope web-fetch-allowed-domains) only once you're
    # comfortable letting personas reach the network from the production host.
    web-fetch-enabled: false
